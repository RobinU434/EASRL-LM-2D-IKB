learning_rate: 0.001
buffer_size: 1_000_000
learning_starts: 100
batch_size: 256
tau: 0.005
gamma: 0.98
train_freq: 1
gradient_steps: 5
action_noise: null
optimize_memory_usage: false
ent_coef: "auto"
target_update_interval: 1
target_entropy: "auto"
use_sde: false
sde_sample_freq: -1
use_sde_at_warmup: false
stats_window_size: 100

policy: CustomSACPolicy # possible: mlpPolicy or cnnPolicy or flowPolicy or latentSACPolicy
# if the policy is not CustomSACPolicy -> the actor is regardless


# load other default config files from the configs directory if they exist
defaults:
  - actor: FlowActor